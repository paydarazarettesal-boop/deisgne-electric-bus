<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f8c"/></marker><style>text{font-family:Arial,sans-serif;fill:#18374b} .h{font-size:26px;font-weight:bold}.s{font-size:19px}.b{fill:white;stroke:#9ab3bd;stroke-width:2} .p{fill:none;stroke:#087f8c;stroke-width:4;marker-end:url(#a)} .c{fill:none;stroke:#bd7a19;stroke-width:3;stroke-dasharray:9 7}</style></defs>
<rect width="1600" height="980" fill="#f3f7fa"/>
<text x="60" y="65" font-size="34" font-weight="bold">12 m ELECTRIC CITY BUS | POWERTRAIN CONCEPT v0.1</text>
<text x="60" y="105" class="s">Assumed: 18,000 kg gross | 80 km/h | 15% grade at 20 km/h | 200 km target range</text>
<rect x="60" y="170" width="325" height="165" rx="15" class="b"/>
<text x="85" y="210" class="h">LFP BATTERY</text><text x="85" y="246" class="s">480.3 kWh | 716.8 V nominal</text><text x="85" y="276" class="s">224 series x 2 full strings</text><text x="85" y="307" class="s">627-818 V assumed DC range</text>
<rect x="445" y="170" width="310" height="165" rx="15" class="b"/>
<text x="470" y="210" class="h">HV DISTRIBUTION</text><text x="470" y="246" class="s">Fuses, contactors, precharge</text><text x="470" y="276" class="s">HVIL, isolation monitoring</text><text x="470" y="307" class="s">Separate string protection</text>
<rect x="815" y="170" width="300" height="165" rx="15" class="b"/>
<text x="840" y="210" class="h">INVERTER</text><text x="840" y="246" class="s">3-phase matched to motor</text><text x="840" y="276" class="s">DC input ~326 kW peak</text><text x="840" y="307" class="s">Excludes auxiliaries</text>
<rect x="1175" y="170" width="360" height="165" rx="15" class="b"/>
<text x="1200" y="210" class="h">TRACTION MOTOR</text><text x="1200" y="246" class="s">300 / 200 kW peak / continuous</text><text x="1200" y="276" class="s">3000 / 2000 Nm shaft torque</text><text x="1200" y="307" class="s">Max 4000 rpm | peak target 30 s</text>
<path d="M385 250H438 M755 250H808 M1115 250H1168" class="p"/>
<rect x="1175" y="410" width="360" height="140" rx="15" class="b"/>
<text x="1200" y="450" class="h">GEAR + DIFFERENTIAL</text><text x="1200" y="485" class="s">2:1 primary x 4:1 final = 8:1</text><text x="1200" y="520" class="s">Assumed mechanical efficiency 95%</text>
<path d="M1355 335V400" class="p"/>
<rect x="1175" y="620" width="360" height="140" rx="15" class="b"/>
<text x="1200" y="660" class="h">REAR DRIVE WHEELS</text><text x="1200" y="695" class="s">22,800 Nm total peak wheel torque</text><text x="1200" y="730" class="s">R = 0.51 m | traction limited</text>
<path d="M1355 550V610" class="p"/>
<rect x="60" y="410" width="325" height="140" rx="15" class="b"/>
<text x="85" y="450" class="h">DC CHARGER</text><text x="85" y="486" class="s">150 kW target</text><text x="85" y="520" class="s">BMS-controlled charge limits</text>
<path d="M222 410V345" class="p"/>
<rect x="445" y="410" width="310" height="140" rx="15" class="b"/>
<text x="470" y="450" class="h">AUXILIARIES</text><text x="470" y="486" class="s">HVAC, air compressor, pumps</text><text x="470" y="520" class="s">DC/DC to 24 V + LV battery</text>
<path d="M600 335V400" class="p"/>
<rect x="815" y="410" width="300" height="140" rx="15" class="b"/>
<text x="840" y="450" class="h">VCU + BMS</text><text x="840" y="486" class="s">Torque, SOC, temperature limits</text><text x="840" y="520" class="s">Traction + brake coordination</text>
<path d="M965 410V345 M815 480H780V365H600V335 M965 550V785H1355V760" class="c"/>
<rect x="60" y="620" width="1055" height="140" rx="15" class="b"/>
<text x="85" y="662" class="h">TWO THERMAL LOOPS</text><text x="85" y="700" class="s">Drive loop: estimated losses 27.1 kW at 200 kW motor shaft output</text><text x="85" y="733" class="s">Battery loop + chiller: estimated 8.1 kW at 450 A, assuming 40 mOhm pack resistance</text>
<path d="M60 830H1540" stroke="#b3c8d0"/>
<text x="60" y="867" class="s">Solid arrows: propulsion energy path. Dashed lines: selected control interfaces. Regen reverses the traction energy flow.</text>
<text x="60" y="904" class="s">Preliminary sizing only. Component targets are not a verified commercial motor/inverter combination.</text>
<text x="60" y="940" class="s">Battery volume and mass require revised packaging. The previous bus STEP has not been updated to this system.</text>
</svg>
